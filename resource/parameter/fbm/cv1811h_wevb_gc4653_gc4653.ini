; mode=0: initialize on linux, mode=1:initialize on alios
[module_config]
alios_sys_mode = 0
alios_vi_mode = 0
alios_vpss_mode = 0
alios_venc_mode = 0

; set slice buff mode or frame buff mode
[slice_buff]
slice_buff_mode = 0

; Systerm -- vb pool config
[vb_config]
vb_pool_cnt     = 1

[vb_pool_0]
bEnable         = 1
frame_width     = 1920
frame_height    = 1080
frame_fmt       = PIXEL_FORMAT_NV21 ; 12: yuv422; 13: yuv420; 19: NV21
data_bitwidth   = DATA_BITWIDTH_8  ; 0: DATA_BITWIDTH_8
compress_mode   = COMPRESS_MODE_NONE  ; 0: COMPRESS_MODE_NONE
blk_cnt         = 8
mem_size        = 0

; gpio config
[gpio_config]
ir_cut_a       = 484
ir_cut_b       = 481
led_white       = -1
led_ir          = -1

; System -- vi vpss mode config
[vi_vpss_mode_0]
enMode          = VI_OFFLINE_VPSS_ONLINE ; VI_OFFLINE_VPSS_OFFLINE = 0; VI_OFFLINE_VPSS_ONLINE = 1 
                    ; VI_ONLINE_VPSS_OFFLINE = 2; VI_ONLINE_VPSS_ONLINE = 3
[vi_vpss_mode_1]
enMode          = VI_OFFLINE_VPSS_ONLINE; VI_OFFLINE_VPSS_OFFLINE = 0; VI_OFFLINE_VPSS_ONLINE = 1 
                    ; VI_ONLINE_VPSS_OFFLINE = 2; VI_ONLINE_VPSS_ONLINE = 3

[vpss_mode]
enMode          = VPSS_MODE_DUAL ; VPSS_MODE_SINGLE = 0; VPSS_MODE_DUAL = 1
                    ; VPSS_MODE_RGNEX = 2; VPSS_MODE_BUTT = 3

[vpss_dev]
dev_cnt         = 2;

[vpss_dev0]
